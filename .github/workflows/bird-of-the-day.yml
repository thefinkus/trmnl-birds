name: Bird of the Day

on:
  schedule:
    # GitHub cron runs in UTC: 01:17 UTC is 02:17 in winter and 03:17 in summer
    # in Europe/Berlin. The script always picks the Berlin calendar date.
    # Three slots because GitHub ran the single 01:17 slot about 6.5 h late on
    # 2026-11-02 and 2026-11-03. The check job below stops a later slot when an
    # earlier one already published today's bird.
    - cron: "17 1 * * *"
    - cron: "17 3 * * *"
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths-ignore: ["preview/**", "README.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      date:
        description: "Date to render (YYYY-MM-DD), empty = today in Europe/Berlin"
        required: false
      species:
        description: "Force a species id, e.g. Upupa_epops (for tests)"
        required: false
      refresh_trmnl:
        description: "Make TRMNL poll and render the result right away"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # ALL = every species that meets the quality bar (7,668).
  # PAL = only species that breed in the Palearctic (789).
  # Set the repository variable REGION to change it without editing this file.
  REGION: ${{ vars.REGION || 'ALL' }}
  SOURCE_REPO: https://github.com/alchaincyf/huashu-bird-sticker.git
  # Pinned commit, so the daily order stays stable. Bump on purpose.
  SOURCE_REF: 2be05e3e614b6e36332eab047ee67d07bf220180

jobs:
  # A scheduled run first asks Pages which date it serves. If that is already
  # today in Europe/Berlin, an earlier slot did the work and this run stops here,
  # so build, deploy and refresh are skipped. Pushes and manual runs always build.
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "${{ github.event_name }} run, building"; exit 0
          fi
          today=$(TZ=Europe/Berlin date +%F)
          live=$(curl -fsS -H "Cache-Control: no-cache" "$PAGES_URL/today.json?t=$(date +%s)" | jq -r .date || true)
          if [ "$live" = "$today" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Pages already serves $today, nothing to do" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Pages serves ${live:-nothing}, building $today"
          fi

  build:
    needs: check
    if: ${{ needs.check.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.build.outputs.date }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch species.json (sparse, blobless)
        run: |
          git init -q src
          cd src
          git remote add origin "$SOURCE_REPO"
          git sparse-checkout set --no-cone /data/species.json
          git fetch -q --depth 1 --filter=blob:none origin "$SOURCE_REF"
          git checkout -q FETCH_HEAD

      - name: Fetch only today's sticker
        env:
          DATE: ${{ inputs.date }}
          SPECIES: ${{ inputs.species }}
        run: |
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ -n "$SPECIES" ] && ARGS+=(--id "$SPECIES")
          git -C src sparse-checkout add "/$(python scripts/build.py --source src "${ARGS[@]}" --print-stickers)"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build today.json and today.png
        id: build
        env:
          DATE: ${{ inputs.date }}
          SPECIES: ${{ inputs.species }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ -n "$SPECIES" ] && ARGS+=(--id "$SPECIES")
          python scripts/build.py --source src --out site "${ARGS[@]}"
          touch site/.nojekyll
          cp trmnl/index.html site/index.html
          echo "### $(jq -r '.name + " (" + .scientific + ")"' site/today.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "${PAGES_URL}/today.json" >> "$GITHUB_STEP_SUMMARY"
          echo "date=$(jq -r .date site/today.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # TRMNL polls on its own clock, every refresh_interval minutes, and renders a new
  # screen only when that poll finds data that differ from the last render. The API's
  # POST .../refreshes only refetches the variables: it neither renders nor moves the
  # clock (seen 2026-11-03: the panel kept yesterday's bird until the next poll slot).
  # What does start a poll-and-render at once is changing the refresh interval. So this
  # job waits until Pages serves today's today.json, sets the interval to 5 minutes,
  # waits for TRMNL to log the poll, and puts the interval back. It needs two things on
  # the repository: the variable TRMNL_PLUGIN_SETTING_ID (the private plugin's id from
  # its URL on trmnl.com) and the secret TRMNL_API_KEY (Account, API key). Without the
  # variable the job is skipped; without the secret it exits early.
  refresh:
    needs: [build, deploy]
    if: ${{ vars.TRMNL_PLUGIN_SETTING_ID != '' && (github.event_name != 'workflow_dispatch' || inputs.refresh_trmnl) }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait until Pages serves today's today.json
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECT: ${{ needs.build.outputs.date }}
        run: |
          got=""
          for i in $(seq 1 30); do
            got=$(curl -fsS -H "Cache-Control: no-cache" "${PAGES_URL%/}/today.json?t=$(date +%s)" | jq -r .date || true)
            if [ "$got" = "$EXPECT" ]; then echo "live: $got"; exit 0; fi
            echo "live: ${got:-none}, want $EXPECT, retry $i"; sleep 10
          done
          echo "::warning::today.json still shows ${got:-nothing} after 5 min, poking TRMNL anyway"

      - name: Make TRMNL poll and render now
        id: poke
        env:
          KEY: ${{ secrets.TRMNL_API_KEY }}
          ID: ${{ vars.TRMNL_PLUGIN_SETTING_ID }}
          EXPECT: ${{ needs.build.outputs.date }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::Secret TRMNL_API_KEY is not set, TRMNL keeps its own schedule"
            exit 0
          fi
          api="https://trmnl.com/api/plugin_settings"
          auth="Authorization: Bearer $KEY"
          was=$(curl -fsS -H "$auth" "$api" \
            | jq -r --argjson id "$ID" '.data[] | select(.id == $id) | .refresh_interval')
          if [ -z "$was" ] || [ "$was" = "null" ]; then echo "::error::Plugin instance $ID not found"; exit 1; fi
          echo "restore=$was" >> "$GITHUB_OUTPUT"
          # Any change of the interval starts a poll cycle at once; the value must differ
          # from the stored one, and it must differ again on a retry.
          toggle=60; [ "$was" = "60" ] && toggle=120
          for attempt in 1 2 3; do
            since=$(date -u +%Y-%m-%dT%H:%M:%S)
            curl -fsS -o /dev/null -X PATCH -H "$auth" -H "Content-Type: application/json" \
              -d "{\"refresh_interval\": $toggle}" "$api/$ID"
            echo "attempt $attempt: interval $was -> $toggle at ${since}Z, waiting for TRMNL's poll"
            line=""
            for i in $(seq 1 12); do
              sleep 10
              line=$(curl -fsS -H "$auth" "$api/$ID/logs" | jq -r --arg since "$since" '
                [.data.logs[] | select((.dump[0].m | split(", ")[1]) > $since)] | first
                | if . == null then "" else [.dump[].m | split(", ")[2:] | join(", ")] | join(" / ") end')
              [ -n "$line" ] && break
            done
            echo "TRMNL: ${line:-no log entry within 120 s}"
            got=$(curl -fsS -H "$auth" "$api/$ID/merge_variables" | jq -r '.data.variables.date // ""')
            if [ "$got" = "$EXPECT" ]; then
              case "$line" in
                *"Screen refresh"*) msg="TRMNL fetched and rendered $EXPECT" ;;
                *) msg="TRMNL already had $EXPECT, nothing to render" ;;
              esac
              echo "$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            echo "TRMNL still holds ${got:-nothing}, want $EXPECT (its Pages edge may cache the old file for up to 10 min)"
            toggle=$(( toggle == 60 ? 120 : 60 )); was=$toggle
            [ "$attempt" -lt 3 ] && sleep 120
          done
          echo "::warning::TRMNL did not pick up $EXPECT in three attempts; its next poll will"

      - name: Put the refresh interval back
        if: ${{ always() && steps.poke.outputs.restore != '' }}
        env:
          KEY: ${{ secrets.TRMNL_API_KEY }}
          ID: ${{ vars.TRMNL_PLUGIN_SETTING_ID }}
          RESTORE: ${{ steps.poke.outputs.restore }}
        run: |
          curl -fsS -o /dev/null -X PATCH -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d "{\"refresh_interval\": $RESTORE}" "https://trmnl.com/api/plugin_settings/$ID"
          echo "interval back to $RESTORE"
