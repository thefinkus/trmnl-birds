name: Bird of the Day

on:
  schedule:
    # GitHub cron runs in UTC: 01:17 UTC is 02:17 in winter and 03:17 in summer
    # in Europe/Berlin. The script always picks the Berlin calendar date.
    - cron: "17 1 * * *"
  push:
    branches: [main]
    paths-ignore: ["preview/**", "README.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      date:
        description: "Date to render (YYYY-MM-DD), empty = today in Europe/Berlin"
        required: false
      species:
        description: "Force a species id, e.g. Upupa_epops (for tests)"
        required: false
      refresh_trmnl:
        description: "Tell TRMNL to fetch the result right away"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # ALL = every species that meets the quality bar (7,668).
  # PAL = only species that breed in the Palearctic (789).
  # Set the repository variable REGION to change it without editing this file.
  REGION: ${{ vars.REGION || 'ALL' }}
  SOURCE_REPO: https://github.com/alchaincyf/huashu-bird-sticker.git
  # Pinned commit, so the daily order stays stable. Bump on purpose.
  SOURCE_REF: 2be05e3e614b6e36332eab047ee67d07bf220180

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.build.outputs.date }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch species.json (sparse, blobless)
        run: |
          git init -q src
          cd src
          git remote add origin "$SOURCE_REPO"
          git sparse-checkout set --no-cone /data/species.json
          git fetch -q --depth 1 --filter=blob:none origin "$SOURCE_REF"
          git checkout -q FETCH_HEAD

      - name: Fetch only today's sticker
        env:
          DATE: ${{ inputs.date }}
          SPECIES: ${{ inputs.species }}
        run: |
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ -n "$SPECIES" ] && ARGS+=(--id "$SPECIES")
          git -C src sparse-checkout add "/$(python scripts/build.py --source src "${ARGS[@]}" --print-stickers)"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build today.json and today.png
        id: build
        env:
          DATE: ${{ inputs.date }}
          SPECIES: ${{ inputs.species }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ -n "$SPECIES" ] && ARGS+=(--id "$SPECIES")
          python scripts/build.py --source src --out site "${ARGS[@]}"
          touch site/.nojekyll
          cp trmnl/index.html site/index.html
          echo "### $(jq -r '.name + " (" + .scientific + ")"' site/today.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "${PAGES_URL}/today.json" >> "$GITHUB_STEP_SUMMARY"
          echo "date=$(jq -r .date site/today.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # TRMNL polls on a fixed interval (24 h for this plugin) with no time of day,
  # so the panel would show yesterday's bird for most of the day. This job asks
  # TRMNL to fetch today.json as soon as it is live. It needs two things on the
  # repository: the variable TRMNL_PLUGIN_SETTING_ID (the private plugin's id
  # from its URL on trmnl.com) and the secret TRMNL_API_KEY (Account, API key).
  # Without the variable the job is skipped; without the secret it exits early.
  refresh:
    needs: [build, deploy]
    if: ${{ vars.TRMNL_PLUGIN_SETTING_ID != '' && (github.event_name != 'workflow_dispatch' || inputs.refresh_trmnl) }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait until Pages serves today's today.json
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECT: ${{ needs.build.outputs.date }}
        run: |
          got=""
          for i in $(seq 1 30); do
            got=$(curl -fsS -H "Cache-Control: no-cache" "${PAGES_URL%/}/today.json?t=$(date +%s)" | jq -r .date || true)
            if [ "$got" = "$EXPECT" ]; then echo "live: $got"; exit 0; fi
            echo "live: ${got:-none}, want $EXPECT, retry $i"; sleep 10
          done
          echo "::warning::today.json still shows ${got:-nothing} after 5 min, refreshing anyway"

      - name: Ask TRMNL to fetch it now
        env:
          KEY: ${{ secrets.TRMNL_API_KEY }}
          ID: ${{ vars.TRMNL_PLUGIN_SETTING_ID }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::Secret TRMNL_API_KEY is not set, TRMNL keeps its own 24 h schedule"
            exit 0
          fi
          api="https://trmnl.com/api/plugin_settings/$ID/refreshes"
          job=$(curl -fsS -X POST -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}' "$api" | jq -r .data.job_id)
          echo "refresh job $job"
          st=pending; res=""
          for i in $(seq 1 20); do
            sleep 3
            res=$(curl -fsS -H "Authorization: Bearer $KEY" "$api/$job")
            st=$(echo "$res" | jq -r .data.status)
            case "$st" in pending|processing) ;; *) break ;; esac
          done
          echo "status: $st"
          echo "$res" | jq -r '"TRMNL refreshed: " + (.data.variables.name // "?") + " (" + (.data.variables.date // "?") + ")"' >> "$GITHUB_STEP_SUMMARY"
          [ "$st" = "complete" ] && [ "$(echo "$res" | jq -r .data.success)" = "true" ]
