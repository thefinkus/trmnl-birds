name: Bird of the Day

on:
  schedule:
    # GitHub cron runs in UTC: 01:17 UTC is 02:17 in winter and 03:17 in summer
    # in Europe/Berlin. The script always picks the Berlin calendar date.
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to render (YYYY-MM-DD), empty = today in Europe/Berlin"
        required: false
      species:
        description: "Force a species id, e.g. Upupa_epops (for layout tests)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # ALL = every species that meets the quality bar (7,668).
  # PAL = only species that breed in the Palearctic (789).
  # Set the repository variable REGION to change it without editing this file.
  REGION: ${{ vars.REGION || 'ALL' }}
  SOURCE_REPO: https://github.com/alchaincyf/huashu-bird-sticker.git
  # Pinned commit, so the daily order stays stable. Bump on purpose.
  SOURCE_REF: 2be05e3e614b6e36332eab047ee67d07bf220180

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch species.json (sparse, blobless)
        run: |
          git init -q src
          cd src
          git remote add origin "$SOURCE_REPO"
          git sparse-checkout set --no-cone /data/species.json
          git fetch -q --depth 1 --filter=blob:none origin "$SOURCE_REF"
          git checkout -q FETCH_HEAD

      - name: Fetch today's sticker only
        env:
          DATE: ${{ inputs.date }}
          SPECIES: ${{ inputs.species }}
        run: |
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ -n "$SPECIES" ] && ARGS+=(--id "$SPECIES")
          STICKER=$(python scripts/build.py --source src "${ARGS[@]}" --print-sticker)
          echo "sticker: $STICKER"
          git -C src sparse-checkout add "/$STICKER"
          # Fixed test birds for the TRMNL previewer (see README).
          while read -r name id; do
            git -C src sparse-checkout add "/$(python scripts/build.py --source src --id "$id" --print-sticker)"
          done < trmnl/samples.txt

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build today.json and today.png
        env:
          DATE: ${{ inputs.date }}
          SPECIES: ${{ inputs.species }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ -n "$SPECIES" ] && ARGS+=(--id "$SPECIES")
          python scripts/build.py --source src --out site "${ARGS[@]}"
          while read -r name id; do
            python scripts/build.py --source src --out "site/samples/$name" --id "$id" \
              --base-url "$PAGES_URL/samples/$name" ${DATE:+--date "$DATE"}
          done < trmnl/samples.txt
          touch site/.nojekyll
          cp trmnl/index.html site/index.html
          echo "### $(jq -r '.name + " (" + .scientific_name + ")"' site/today.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "${PAGES_URL}/today.json" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
